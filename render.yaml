services:
  - type: web
    name: smartcart-backend
    runtime: docker
    dockerfilePath: smartcart-backend/Dockerfile
    buildContext: .
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
